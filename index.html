<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Dashboard multi-tools untuk kreator konten bisnis kriya handmade. Tulis naskah, edit foto, teleprompter, dan publish — semua dalam satu tempat." />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
    rel="stylesheet">
  <title>The Artisan Content Hub</title>
</head>

<body>
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">✦</div>
        <span class="brand-text">Artisan Hub</span>
      </div>
      <ul class="nav-list">
        <li>
          <a href="#writer" class="nav-item active" data-page="writer" id="nav-writer">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
              <path d="m15 5 4 4" />
            </svg>
            <span>Content Writer</span>
          </a>
        </li>
        <li>
          <a href="#studio" class="nav-item" data-page="studio" id="nav-studio">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
              <circle cx="9" cy="9" r="2" />
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
            </svg>
            <span>Photo Studio</span>
          </a>
        </li>
        <li>
          <a href="#teleprompter" class="nav-item" data-page="teleprompter" id="nav-teleprompter">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="10" height="14" x="7" y="2" rx="5" />
              <path d="M4 11a8 8 0 0 0 16 0" />
              <line x1="12" x2="12" y1="19" y2="22" />
            </svg>
            <span>Teleprompter</span>
          </a>
        </li>
        <li>
          <a href="#ideas" class="nav-item" data-page="ideas" id="nav-ideas">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
              <path d="M9 18h6" />
              <path d="M10 22h4" />
            </svg>
            <span>Bank Ide</span>
          </a>
        </li>
        <li>
          <a href="#vault" class="nav-item" data-page="vault" id="nav-vault">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7.5 4.27 9 5.15" />
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
              <path d="m3.3 7 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
            <span>Content Vault</span>
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="nav-item settings-btn" id="settings-btn">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Pengaturan</span>
        </button>
      </div>
    </nav>

    <!-- Mobile Header -->
    <header class="mobile-header" id="mobile-header">
      <button class="menu-toggle" id="menu-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>
      <div class="mobile-brand">
        <span class="brand-icon">✦</span>
        <span>Artisan Hub</span>
      </div>
    </header>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Pages will be injected here -->
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ Pengaturan</h2>
        <button class="modal-close" id="settings-close">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Groq API Key -->
        <div class="form-group">
          <label for="groq-key">🚀 Groq API Key <span
              style="font-size:var(--font-xs);color:var(--text-muted);font-weight:400;">— untuk Content
              Writer</span></label>
          <p class="form-hint">Dapatkan gratis di <a href="https://console.groq.com/keys" target="_blank"
              rel="noopener">console.groq.com/keys</a></p>
          <div class="input-group">
            <input type="password" id="groq-key" placeholder="gsk_..." autocomplete="off" />
            <button class="btn-icon toggle-key-vis" data-target="groq-key" title="Tampilkan/Sembunyikan">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <!-- Gemini API Key -->
        <div class="form-group">
          <label for="gemini-key">✨ Gemini API Key <span
              style="font-size:var(--font-xs);color:var(--text-muted);font-weight:400;">— untuk Photo Studio
              AI</span></label>
          <p class="form-hint">Dapatkan gratis di <a href="https://aistudio.google.com/apikey" target="_blank"
              rel="noopener">Google AI Studio</a> <span style="font-size:0.65rem;opacity:0.6;">(opsional)</span></p>
          <div class="input-group">
            <input type="password" id="gemini-key" placeholder="AIza..." autocomplete="off" />
            <button class="btn-icon toggle-key-vis" data-target="gemini-key" title="Tampilkan/Sembunyikan">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-full" id="save-settings">Simpan Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet (reusable) -->
  <div class="bottom-sheet-overlay" id="bottom-sheet-overlay">
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="bottom-sheet-handle"></div>
      <div class="bottom-sheet-header">
        <h3 id="bottom-sheet-title">Pilih dari Arsip</h3>
        <button class="modal-close" id="bottom-sheet-close">&times;</button>
      </div>
      <div class="bottom-sheet-body" id="bottom-sheet-body">
        <!-- Content loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
